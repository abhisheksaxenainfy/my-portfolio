<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#111111"/>

  <!-- Layer 3 — bottom, widest, most transparent -->
  <rect x="8" y="46" width="48" height="10" rx="3" fill="#f97316" opacity="0.35"/>

  <!-- Layer 2 — middle -->
  <rect x="14" y="33" width="36" height="10" rx="3" fill="#f97316" opacity="0.65"/>

  <!-- Layer 1 — top, narrowest, full opacity -->
  <rect x="22" y="20" width="20" height="10" rx="3" fill="#f97316"/>

  <!-- Plus icon above top block — "building" indicator -->
  <line x1="32" y1="10" x2="32" y2="17" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="28.5" y1="13.5" x2="35.5" y2="13.5" stroke="#f97316" stroke-width="2.2" stroke-linecap="round"/>
</svg>
